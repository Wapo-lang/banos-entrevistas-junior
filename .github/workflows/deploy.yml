name: 🚀 Deploy NestJS Interviews Simulator API to VPS

on:
  push:
    branches: [main, feature/users-entities]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Copy project to VPS
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        source: "."
        target: "/home/banosc/banos-entrevistas-junior"

    - name: Run deploy commands on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        script: |
          set -e
          
          # 1. Moverse a la subcarpeta real del backend
          cd /home/banosc/banos-entrevistas-junior/simulador_entrevistas
          
          # 2. Inyectar las variables de entorno configuradas en tus Secrets
          printf "%s" "${{ secrets.ENV_FILE }}" > .env
          
          # 3. Limpieza e instalación optimizada para cuidar la RAM del VPS
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund --prefer-offline
          
          # 4. Compilar la aplicación usando nest local
          npx nest build --clean
          
          # 5. Reiniciar de forma segura tu proceso en PM2
          pm2 stop banos-entrevistas-junior-api || true
          pm2 delete banos-entrevistas-junior-api || true
          pm2 start dist/main.js --name banos-entrevistas-junior-api
          pm2 save